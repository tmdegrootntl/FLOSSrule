<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics.io - FLOSS Rule Proofreader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            background: radial-gradient(circle, #2a2a40 0%, #151522 100%);
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        .target-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px;
            border-radius: 20px;
            border: 2px solid #00f5d4;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: #00f5d4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-board {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 10px;
            pointer-events: none;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #f72585;
        }

        button {
            background: #00f5d4;
            color: #1e1e2f;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #00c4aa;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="target-box">
            <span>Mission: </span>
            <h1 id="target-sound">Collect CORRECTLY Spelled FLOSS Words!</h1>
        </div>
    </div>

    <div class="score-board">
        Score: <span id="score">0</span> | Size: <span id="size">30</span>
    </div>

    <div id="game-over">
        <h2 style="color: #f72585;">Spelling Error Hit!</h2>
        <p id="error-message">You hit a misspelled word!</p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

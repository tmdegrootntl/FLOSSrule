<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics.io - FLOSS Rule Proofreader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            background: radial-gradient(circle, #2a2a40 0%, #151522 100%);
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        .target-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px;
            border-radius: 20px;
            border: 2px solid #00f5d4;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: #00f5d4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-board {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 10px;
            pointer-events: none;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #f72585;
        }

        button {
            background: #00f5d4;
            color: #1e1e2f;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #00c4aa;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="target-box">
            <span>Mission: </span>
            <h1 id="target-sound">Collect CORRECTLY Spelled FLOSS Words!</h1>
        </div>
    </div>

    <div class="score-board">
        Score: <span id="score">0</span> | Size: <span id="size">30</span>
    </div>

    <div id="game-over">
        <h2 style="color: #f72585;">Spelling Error Hit!</h2>
        <p id="error-message">You hit a misspelled word!</p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Expanded FLOSS Word Bank
        const FLOSS_PAIRS = [
            // Double FF vs Single F
            { correct: "cliff", wrong: "clif" },
            { correct: "sniff", wrong: "snif" },
            { correct: "stiff", wrong: "stif" },
            { correct: "stuff", wrong: "stuf" },
            { correct: "fluff", wrong: "fluf" },
            { correct: "cuff",  wrong: "cuf"  },
            { correct: "off",   wrong: "of"   },
            { correct: "scuff", wrong: "scuf" },
            { correct: "bluff", wrong: "bluf" },

            // Double LL vs Single L
            { correct: "bell",  wrong: "bel"  },
            { correct: "tell",  wrong: "tel"  },
            { correct: "yell",  wrong: "yel"  },
            { correct: "hill",  wrong: "hil"  },
            { correct: "mill",  wrong: "mil"  },
            { correct: "doll",  wrong: "dol"  },
            { correct: "well",  wrong: "wel"  },
            { correct: "shell", wrong: "shel" },
            { correct: "smell", wrong: "smel" },
            { correct: "chill", wrong: "chil" },

            // Double SS vs Single S
            { correct: "pass",  wrong: "pas"  },
            { correct: "grass", wrong: "gras" },
            { correct: "mess",  wrong: "mes"  },
            { correct: "less",  wrong: "les"  },
            { correct: "kiss",  wrong: "kis"  },
            { correct: "miss",  wrong: "mis"  },
            { correct: "boss",  wrong: "bos"  },
            { correct: "class", wrong: "clas" },
            { correct: "glass", wrong: "glas" },
            { correct: "dress", wrong: "dres" },

            // Double ZZ vs Single Z
            { correct: "fizz",  wrong: "fiz"  },
            { correct: "buzz",  wrong: "buz"  },
            { correct: "jazz",  wrong: "jaz"  },
            { correct: "fuzz",  wrong: "fuz"  }
        ];

        // Player object
        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 30,
            color: "#00f5d4",
            speed: 0.08,
            score: 0
        };

        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let bubbles = [];
        let isGameOver = false;

        // Speech Synthesis Setup
        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Spawn a bubble into the world
        // forcedType: true = guaranteed correct, false = guaranteed wrong, null = random
        function spawnBubble(forcedType = null) {
            const isCorrect = (forcedType !== null) ? forcedType : (Math.random() < 0.5);
            const randomPair = FLOSS_PAIRS[Math.floor(Math.random() * FLOSS_PAIRS.length)];

            const wordText = isCorrect ? randomPair.correct : randomPair.wrong;

            bubbles.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                radius: 28,
                word: wordText,
                isValid: isCorrect,
                correctVersion: randomPair.correct
            });
        }

        // Initialize board with half correct and half wrong bubbles
        function initBubbles(totalCount = 16) {
            bubbles = [];
            const correctCount = Math.floor(totalCount / 2);
            const wrongCount = totalCount - correctCount;

            for (let i = 0; i < correctCount; i++) {
                spawnBubble(true);  // Spawn correct
            }
            for (let i = 0; i < wrongCount; i++) {
                spawnBubble(false); // Spawn wrong
            }
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.radius = 30;
            player.score = 0;
            isGameOver = false;
            document.getElementById("score").textContent = player.score;
            document.getElementById("size").textContent = Math.round(player.radius);
            document.getElementById("game-over").style.display = "none";
            initBubbles();
            gameLoop();
        }

        function update() {
            if (isGameOver) return;

            // Smooth movement toward mouse cursor
            player.x += (mouse.x - player.x) * player.speed;
            player.y += (mouse.y - player.y) * player.speed;

            // Keep player inside canvas
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Collision Detection with Bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                let dist = Math.hypot(player.x - b.x, player.y - b.y);

                if (dist < player.radius + b.radius) {
                    if (b.isValid) {
                        // Correct Word Collected
                        speakWord(b.word);

                        player.score += 10;
                        player.radius += 1.2;
                        document.getElementById("score").textContent = player.score;
                        document.getElementById("size").textContent = Math.round(player.radius);

                        bubbles.splice(i, 1);
                        
                        // FIX: Always spawn a GUARANTEED correct word when one is collected
                        spawnBubble(true);
                    } else {
                        // Misspelled Word Hit - Game Over
                        isGameOver = true;
                        speakWord("Oops! " + b.word + " is misspelled.");

                        document.getElementById("error-message").innerHTML = 
                            `<strong>"${b.word.toUpperCase()}"</strong> is misspelled!<br>The FLOSS rule requires doubling the last letter: <strong>"${b.correctVersion.toUpperCase()}"</strong>.`;
                        document.getElementById("game-over").style.display = "block";
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Word Bubbles
            bubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#3a3a5c";
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#00f5d4";
                ctx.stroke();

                // Draw Word Text
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(b.word, b.x, b.y);
            });

            // Draw Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();

            // Draw Player Eye pointing to cursor
            ctx.beginPath();
            let angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            let eyeX = player.x + Math.cos(angle) * (player.radius * 0.5);
            let eyeY = player.y + Math.sin(angle) * (player.radius * 0.5);
            ctx.arc(eyeX, eyeY, player.radius * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = "#1e1e2f";
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Start Game
        initBubbles();
        gameLoop();
    </script>
</body>
</html>
